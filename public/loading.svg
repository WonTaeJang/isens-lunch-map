<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none" color="#0d8275" role="img" aria-labelledby="loading-title">
  <title id="loading-title">불러오는 중</title>
  <style>
    .loading-arc {
      animation: loading-spin 1s linear infinite;
    }
    @keyframes loading-spin {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -100; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loading-arc { animation: none; }
    }
  </style>
  <circle cx="20" cy="20" r="15" stroke="currentColor" stroke-opacity="0.12" stroke-width="3" />
  <circle class="loading-arc" cx="20" cy="20" r="15" pathLength="100" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 70" />
</svg>
